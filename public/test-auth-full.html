<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Authentication</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 2rem;
      text-align: center;
    }
    .test-section {
      margin: 2rem 0;
      padding: 1.5rem;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .test-section h2 {
      color: #667eea;
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #555;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 6px;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      max-height: 300px;
      overflow-y: auto;
    }
    .result.success {
      background: #d4edda;
      border: 2px solid #c3e6cb;
      color: #155724;
    }
    .result.error {
      background: #f8d7da;
      border: 2px solid #f5c6cb;
      color: #721c24;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Authentication Test Suite</h1>

    <!-- Signup Test -->
    <div class="test-section">
      <h2>1️⃣ Test Signup (Create New User)</h2>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="signupEmail" placeholder="test@example.com">
      </div>
      <div class="form-group">
        <label>Username:</label>
        <input type="text" id="signupUsername" placeholder="testuser">
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters">
      </div>
      <div class="form-group">
        <label>First Name (optional):</label>
        <input type="text" id="signupFirstName" placeholder="John">
      </div>
      <div class="form-group">
        <label>Last Name (optional):</label>
        <input type="text" id="signupLastName" placeholder="Doe">
      </div>
      <div class="form-group">
        <label>Display Name (optional):</label>
        <input type="text" id="signupName" placeholder="John Doe">
      </div>
      <button onclick="testSignup()">Create Account</button>
      <div id="signupResult" class="result hidden"></div>
    </div>

    <!-- Signin Test -->
    <div class="test-section">
      <h2>2️⃣ Test Signin (Login)</h2>
      <div class="form-group">
        <label>Email or Username:</label>
        <input type="text" id="signinEmail" placeholder="test@example.com or testuser">
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="signinPassword" placeholder="Your password">
      </div>
      <button onclick="testSignin()">Login</button>
      <div id="signinResult" class="result hidden"></div>
    </div>

    <!-- Admin Login Test -->
    <div class="test-section">
      <h2>3️⃣ Test Admin Login</h2>
      <p style="color: #666; margin-bottom: 1rem;">Quick test with admin credentials</p>
      <button onclick="testAdmin()">Login as Admin</button>
      <div id="adminResult" class="result hidden"></div>
    </div>

    <!-- Check Users -->
    <div class="test-section">
      <h2>4️⃣ View All Users</h2>
      <p style="color: #666; margin-bottom: 1rem;">See all users in the database</p>
      <button onclick="checkUsers()">Fetch Users</button>
      <div id="usersResult" class="result hidden"></div>
    </div>
  </div>

  <script>
    async function testSignup() {
      const email = document.getElementById('signupEmail').value;
      const username = document.getElementById('signupUsername').value;
      const password = document.getElementById('signupPassword').value;
      const name = document.getElementById('signupName').value;
      const first_name = document.getElementById('signupFirstName').value;
      const last_name = document.getElementById('signupLastName').value;
      const resultDiv = document.getElementById('signupResult');

      if (!email || !username || !password) {
        showResult(resultDiv, 'error', 'Please fill in all required fields');
        return;
      }

      try {
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, username, password, name, first_name, last_name })
        });

        const data = await response.json();

        if (response.ok) {
          showResult(resultDiv, 'success', 
            `✅ SUCCESS!\n\n` +
            `User Created:\n` +
            `- ID: ${data.user.id}\n` +
            `- Username: ${data.user.username}\n` +
            `- Email: ${data.user.email}\n` +
            `- Role: ${data.user.role}\n\n` +
            `Token: ${data.token.substring(0, 50)}...\n\n` +
            `✨ User saved to database!\n` +
            `Now try logging in below.`
          );
        } else {
          showResult(resultDiv, 'error', 
            `❌ ERROR:\n${data.error || 'Unknown error'}\n\n` +
            JSON.stringify(data, null, 2)
          );
        }
      } catch (error) {
        showResult(resultDiv, 'error', `❌ FETCH ERROR:\n${error.message}`);
      }
    }

    async function testSignin() {
      const emailOrUsername = document.getElementById('signinEmail').value;
      const password = document.getElementById('signinPassword').value;
      const resultDiv = document.getElementById('signinResult');

      if (!emailOrUsername || !password) {
        showResult(resultDiv, 'error', 'Please fill in all fields');
        return;
      }

      try {
        const response = await fetch('/api/auth/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailOrUsername, password })
        });

        const data = await response.json();

        if (response.ok) {
          showResult(resultDiv, 'success', 
            `✅ LOGIN SUCCESS!\n\n` +
            `User Info:\n` +
            `- ID: ${data.user.id}\n` +
            `- Username: ${data.user.username}\n` +
            `- Email: ${data.user.email}\n` +
            `- Name: ${data.user.firstName} ${data.user.lastName}\n` +
            `- Role: ${data.user.role}\n\n` +
            `Token: ${data.token.substring(0, 50)}...\n\n` +
            `✨ Authenticated from database!`
          );
        } else {
          showResult(resultDiv, 'error', 
            `❌ LOGIN FAILED:\n${data.error || 'Unknown error'}\n\n` +
            JSON.stringify(data, null, 2)
          );
        }
      } catch (error) {
        showResult(resultDiv, 'error', `❌ FETCH ERROR:\n${error.message}`);
      }
    }

    async function testAdmin() {
      const resultDiv = document.getElementById('adminResult');

      try {
        const response = await fetch('/api/auth/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            emailOrUsername: 'admin', 
            password: 'admin123' 
          })
        });

        const data = await response.json();

        if (response.ok) {
          showResult(resultDiv, 'success', 
            `✅ ADMIN LOGIN SUCCESS!\n\n` +
            JSON.stringify(data, null, 2)
          );
        } else {
          showResult(resultDiv, 'error', 
            `❌ ADMIN LOGIN FAILED:\n${JSON.stringify(data, null, 2)}`
          );
        }
      } catch (error) {
        showResult(resultDiv, 'error', `❌ FETCH ERROR:\n${error.message}`);
      }
    }

    async function checkUsers() {
      const resultDiv = document.getElementById('usersResult');

      try {
        const response = await fetch('/api/users');
        const data = await response.json();

        if (response.ok) {
          showResult(resultDiv, 'success', 
            `✅ FOUND ${data.count || data.users?.length || 0} USERS:\n\n` +
            JSON.stringify(data.users || data, null, 2)
          );
        } else {
          showResult(resultDiv, 'error', 
            `❌ ERROR:\n${JSON.stringify(data, null, 2)}`
          );
        }
      } catch (error) {
        showResult(resultDiv, 'error', `❌ FETCH ERROR:\n${error.message}`);
      }
    }

    function showResult(element, type, message) {
      element.className = `result ${type}`;
      element.textContent = message;
      element.classList.remove('hidden');
      element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Auto-fill with test data
    window.addEventListener('DOMContentLoaded', () => {
      const randomNum = Math.floor(Math.random() * 1000);
      const firstNames = ['John', 'Jane', 'Mike', 'Sarah', 'Chris', 'Emma', 'David', 'Lisa'];
      const lastNames = ['Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller', 'Davis'];
      const randomFirst = firstNames[Math.floor(Math.random() * firstNames.length)];
      const randomLast = lastNames[Math.floor(Math.random() * lastNames.length)];
      
      document.getElementById('signupEmail').value = `user${randomNum}@example.com`;
      document.getElementById('signupUsername').value = `user${randomNum}`;
      document.getElementById('signupPassword').value = 'password123';
      document.getElementById('signupFirstName').value = randomFirst;
      document.getElementById('signupLastName').value = randomLast;
      document.getElementById('signupName').value = `${randomFirst} ${randomLast}`;
    });
  </script>
</body>
</html>
